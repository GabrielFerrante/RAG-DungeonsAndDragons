# Configuracao compartilhada do projeto (lida por src/utils/helpers.py).
# Hiperparametros de treino/avaliacao continuam como opcoes de linha de comando de cada script.

models:
  retriever: TomoroAI/tomoro-colqwen3-embed-4b   # retriever visual multi-vetor (base do fine-tuning)
  # Commit do codigo custom (trust_remote_code) usado para treinar os adapters existentes. Sem isso,
  # cada load consulta a Hub pelo commit mais recente de "main" (rede, mais lento, e pode baixar codigo
  # diferente do que gerou os adapters - um push da TomoroAI quebraria best/final silenciosamente).
  retriever_revision: 13517a29e8c5e408f7f2684337ed407df3acb212
  vlm: Qwen/Qwen3-VL-4B-Instruct                 # gera perguntas sinteticas / responde

chunking:
  min_chars: 300   # paginas com menos texto extraido (capa, em branco) ficam fora do treino/avaliacao

paths:
  # Indices de embeddings (page_index.pt) ficam aqui, fora do repositorio: ~470 MB por adapter para o
  # corpus inteiro (medido: 57 MB para 120 paginas), grande demais pra versionar e derivado de conteudo
  # licenciado (mesma politica de data/ e outputs/no .gitignore). Mesmo disco do cache de modelos
  # (HF_HOME=G:\hf_cache, configurado no env conda "ragded") por ter mais espaco livre que o C:.
  # Ausente ou sem G: -> cai em outputs/retrieval_index (dentro do repo, mas ja gitignorado).
  cache_dir: G:/rag_cache

# slug (nome do PDF sem extensao, minusculo) -> nome para citacao
books:
  playerbook: Livro do Jogador
  masterguidebook: Guia do Mestre
  monstersbook: Livro dos Monstros

# O indice do manifesto (1-based, pela ordem fisica do PDF) NAO bate com o numero IMPRESSO na pagina:
# capa/guardas/sumario empurram cada livro de um jeito. printed = manifest + offset. Conferido
# visualmente (nao so no comeco: inicio, meio e fim de cada livro) em 2026-10-09.
#   Livro do Jogador: manifest 20/150 -> impresso 21/151  (+1)
#   Guia do Mestre:   manifest 20/300 -> impresso 19/299  (-1)
#   Livro dos Monstros: manifest 10/15/61/350 -> impresso 9/14/60/349  (-1)
# So vale pro texto mostrado ao usuario (src/retrieval/ask.py); o indice do manifesto continua sendo
# usado internamente (nome dos arquivos em data/pages|text/, chaves de todo o resto do codigo).
book_page_offsets:
  playerbook: 1
  masterguidebook: -1
  monstersbook: -1

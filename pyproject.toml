[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-rag"
version = "0.1.0"
description = "RAG multimodal (PT-BR) para Dungeons & Dragons 5E, 100% local"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
